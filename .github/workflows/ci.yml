name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  backend-check:
    name: Backend — ruff / mypy / pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements*.txt

      - name: Install dependencies
        working-directory: services/api
        run: pip install ruff mypy pytest pytest-cov -r requirements.txt

      - name: Lint — ruff
        run: ruff check services/api

      - name: Type-check — mypy
        run: mypy services/api/app

      - name: Test — pytest
        run: pytest services/api/tests -v --cov=services/api/app --cov-report=term-missing

  frontend-check:
    name: Frontend — type-check / build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm --filter web type-check

      - name: Build
        run: pnpm --filter web build
