name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  backend-check:
    name: Backend — ruff / mypy / pytest
    runs-on: ubuntu-latest

    # Everything runs from services/api so that `import app` resolves and the
    # ruff/mypy config in services/api/pyproject.toml is picked up.
    defaults:
      run:
        working-directory: services/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install spaCy language model
        run: python -m spacy download en_core_web_sm

      - name: Lint — ruff
        run: ruff check .

      - name: Type-check — mypy
        run: mypy app

      - name: Test — pytest
        run: pytest tests -v --cov=app --cov-report=term-missing

  frontend-check:
    name: Frontend — type-check / build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # Must match the pnpm that produced pnpm-lock.yaml / pnpm-workspace.yaml
          # (the `allowBuilds:` key is pnpm 11+), otherwise --frozen-lockfile fails.
          version: 11
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm --filter web type-check

      - name: Build
        run: pnpm --filter web build
