name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "services/api/**"

jobs:
  deploy:
    name: Trigger Render deploy hook
    runs-on: ubuntu-latest

    steps:
      - name: Trigger deploy
        run: |
          curl --fail-with-body -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
