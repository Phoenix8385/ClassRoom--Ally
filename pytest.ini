[pytest]
asyncio_mode = strict

# Running `pytest` from the repo root previously walked the whole tree —
# including venv/Lib/site-packages, whose __init__.py dirs are collected as
# Packages. pytest-asyncio 0.23 crashes on those under pytest 8
# ("'Package' object has no attribute 'obj'"), so the run died during
# collection before reaching a single real test.
testpaths = services/api/tests

# services/api/tests/unit has no __init__.py, so pytest would otherwise put
# that directory on sys.path instead of the service root and `import app` fails.
pythonpath = services/api

norecursedirs =
    venv
    */venv
    node_modules
    */node_modules
    .git
    .next
    data
    demo
