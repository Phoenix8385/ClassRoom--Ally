[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "venv", "__pycache__", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501  line length is handled by the formatter, not the linter
# B008   `Depends(...)` in an argument default is the standard FastAPI idiom
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_configs = true

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true
